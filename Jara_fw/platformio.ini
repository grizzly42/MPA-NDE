; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:atmega328pb_baremetal]
platform = atmelavr
board = ATmega328PB_custom
board_build.mcu = atmega328pb
board_build.f_cpu = 16000000L
upload_protocol = custom
upload_port = /dev/cu.usbserial-0001
upload_speed = 57600
build_flags = -Os -Wall -std=gnu99
upload_command = /Users/topsecret/Library/Arduino15/packages/MiniCore/tools/avrdude/8.0-arduino.1/bin/avrdude -C /Users/topsecret/Library/Arduino15/packages/MiniCore/tools/avrdude/8.0-arduino.1/etc/avrdude.conf -v -p atmega328pb -c urclock -P /dev/cu.usbserial-0001 -b 57600 -D -U flash:w:$BUILD_DIR/firmware.hex:i
lib_deps = mikem/RadioHead@^1.120
